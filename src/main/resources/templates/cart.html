<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>カート</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<form th:action="@{/products}" method="get">
		<input type="hidden" name="selectedCategory" th:value="${selectedCategory}">
		<input type="hidden" name="keyword" th:value="${keyword}">
		<input type="hidden" name="sort" th:value="${sort}">
		<button type="submit" class="returnBtn">商品一覧に戻る</button>
	</form>

	<table border="1" th:if="${!#lists.isEmpty(cart)}" class="wrap">
		<thead>
			<tr>
				<th></th>
				<th>商品名</th>
				<th>価格</th>
				<th>数量</th>
				<th>税率</th>
				<th>金額（税別）</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item : ${cart}" class="cart-item" th:attr="data-price=${item.product.price},data-tax-rate=${item.product.taxRate},data-update-url=@{/cart/update/{id}(id=${item.product.id})}">
				<td><img th:src="${item.product.img}" class="cart-img"></td>
				<td th:text="${item.product.name}" class="table-text"></td>
				<td th:text="${#numbers.formatInteger(item.product.price, 3, 'COMMA')} + ' 円'" class="table-text"></td>
				<td><input type="number" th:value="${item.quantity}" min="1" class="table-text quantity-cell" aria-label="数量">
				</td>
				<td th:text="${item.product.taxRate} + '%'" class="table-text"></td>
				<td class="table-text"><span class="item-subtotal" th:text="${item.product.price * item.quantity}"></span> 円</td>

				<td>
					<form th:action="@{/cart/delete/{id}(id=${item.product.id})}" method="post">
						<button type="submit" class="delete-btn">削除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>

	<div class="center">
		<p th:if="${#lists.isEmpty(cart)}">カートに入っている商品はありません</p>
		<div th:unless="${#lists.isEmpty(cart)}">
			<p>小計（税別）：<span id="subtotal">0</span> 円</p>
			<p>8%消費税合計：<span id="tax-8">0</span> 円</p>
			<p>10%消費税合計：<span id="tax-10">0</span> 円</p>
			<p>合計： <span id="total" class="total">0</span> 円</p>

			<form th:action="@{/order}" method="post">
				<button type="submit" class="order-btn">注文</button>
			</form>
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const cartItems = document.querySelectorAll('.cart-item');
			const subtotalElement = document.getElementById('subtotal');
			const tax8Element = document.getElementById('tax-8');
			const tax10Element = document.getElementById('tax-10');
			const totalElement = document.getElementById('total');

			const formatYen = (amount) => amount.toLocaleString('ja-JP');

			const updateTotals = () => {
				let subtotal = 0;
				let tax8 = 0;
				let tax10 = 0;

				cartItems.forEach((item) => {
					const price = Number(item.dataset.price) || 0;
					const taxRate = Number(item.dataset.taxRate) || 0;
					const quantityInput = item.querySelector('.quantity-cell');
					const quantity = Math.max(1, Number(quantityInput.value) || 1);
					quantityInput.value = quantity;
					const itemSubtotal = price * quantity;
					const itemTax = Math.round(itemSubtotal * taxRate / 100);

					subtotal += itemSubtotal;
					if (taxRate === 8) {
						tax8 += itemTax;
					} else if (taxRate === 10) {
						tax10 += itemTax;
					}
					item.querySelector('.item-subtotal').textContent = formatYen(itemSubtotal);
				});

				subtotalElement.textContent = formatYen(subtotal);
				tax8Element.textContent = formatYen(tax8);
				tax10Element.textContent = formatYen(tax10);
				totalElement.textContent = formatYen(subtotal + tax8 + tax10);
			};

			cartItems.forEach((item) => {
				const quantityInput = item.querySelector('.quantity-cell');
				quantityInput.addEventListener('input', updateTotals);
				quantityInput.addEventListener('change', () => {
					const quantity = Math.max(1, Number(quantityInput.value) || 1);
					quantityInput.value = quantity;
					fetch(item.dataset.updateUrl, {
						method: 'POST',
						headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
						body: new URLSearchParams({ quantity }),
						keepalive: true
					});
				});
			});
			updateTotals();
		});
	</script>

</body>

</html>
